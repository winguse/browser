name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-browser-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Rewriter Toolchain
        uses: ./browser.js/packages/scramjet/.github/actions/setup-rewriter-toolchain
        with:
          wasm-bindgen-version: "0.2.105"
          rewriter-path: browser.js/packages/scramjet/packages/core/rewriter
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build browser.js static assets
        run: |
          cd browser.js
          export VITE_ISOLATION_ORIGIN=none
          git apply ../patches/browser-js-wisp.patch
          pnpm install --no-frozen-lockfile
          RELEASE=1 pnpm rewriter:build
          pnpm build:dreamland
          pnpm build
          pnpm build:chrome

      - name: Upload browser.js static assets artifact
        uses: actions/upload-artifact@v7
        with:
          name: browser-assets
          path: |
            browser.js/packages/chrome/dist
            browser.js/packages/sandbox
          retention-days: 1

  build-firefox-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Install firefox-wasm build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm-dev libpulse-dev python3 mercurial unzip zstd rsync \
            wget lsb-release gnupg software-properties-common
          LLVM_VER=21
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh ${LLVM_VER}
          sudo apt-get install -y --no-install-recommends libclang-${LLVM_VER}-dev
          echo "LIBCLANG_PATH=/usr/lib/llvm-${LLVM_VER}/lib" >> "$GITHUB_ENV"

      - name: Set up Rust 1.95.0 (+ rust-src, wasm target)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: rust-src
          targets: wasm32-unknown-emscripten

      - name: Free disk space & add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          SW=/swapfile
          if ! swapon --show 2>/dev/null | grep -q .; then
            ( sudo fallocate -l 24G "$SW" || sudo dd if=/dev/zero of="$SW" bs=1M count=24576 ) 2>/dev/null \
              && sudo chmod 600 "$SW" && sudo mkswap "$SW" >/dev/null 2>&1 && sudo swapon "$SW" 2>/dev/null || true
          fi

      - name: Set up Emscripten 6.0.1
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.1
          "$HOME/emsdk/emsdk" activate 6.0.1
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          echo "$HOME/emsdk" >> "$GITHUB_PATH"
          export EMSDK="$HOME/emsdk"
          node firefox-wasm/gecko.js/patch-emsdk-wasmfs.mjs "$HOME/emsdk/upstream/emscripten"
          touch "$HOME/emsdk/.wisp-patched"

      - name: Build firefox-wasm via submodule Makefile
        run: |
          cd firefox-wasm
          git apply ../patches/firefox-wasm.patch
          ulimit -s unlimited || ulimit -s 524288 || true
          make libxul RELEASE=1
          export GECKO_OBJDIR="${PWD}/obj-full-emscripten-release"
          make chrome-assets
          pnpm --filter chrome-demo build

      - name: Upload firefox-wasm static assets artifact
        uses: actions/upload-artifact@v7
        with:
          name: firefox-assets
          path: |
            firefox-wasm/demo/chrome/dist
          retention-days: 1

  build:
    needs: [build-browser-assets, build-firefox-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download pre-built browser.js static assets
        uses: actions/download-artifact@v8
        with:
          name: browser-assets
          path: browser.js/packages/

      - name: Download pre-built firefox-wasm static assets
        uses: actions/download-artifact@v8
        with:
          name: firefox-assets
          path: firefox-wasm/demo/chrome/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Create multi-arch manifest list and push
        working-directory: /tmp/digests
        run: |
          TAGS=$(jq -r '(.tags | map("-t " + .)) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          DIGESTS=$(ls | sed "s|^|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:|")
          docker buildx imagetools create $TAGS $DIGESTS

      - name: Inspect image manifest
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
